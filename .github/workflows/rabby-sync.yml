name: Rabby Transaction Sync

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run transaction sync
        env:
          # Wallet configuration
          WALLET_LIST: ${{ secrets.WALLET_LIST }}

          # Google Sheets configuration
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Sheet1' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          # Logging: INFO (default) or DEBUG for verbose per-request logs
          LOG_LEVEL: 'INFO'

          # Rate limit tuning (optional — adaptive defaults are sensible)
          JITTER_MIN_MS: '3000'        # min spacing between requests
          JITTER_MAX_MS: '6000'        # max spacing between requests
          MAX_DELAY_MS: '20000'        # ceiling for adaptive request spacing
          RATE_LIMIT_WAIT_MS: '60000'  # base cooldown on 429/403 (no Retry-After)
          MAX_COOLDOWN_MS: '300000'    # hard cap on a single cooldown (5 min)
          MAX_RETRIES: '10'            # max attempts per wallet
          MAX_BLOCK_RETRIES: '4'       # max 429/403 cooldowns before giving up a wallet
          MAX_TIMEOUT_RETRIES: '5'     # max retries on network timeout
          CHUNK_SIZE: '500'            # rows per Google Sheets write
        run: node src/index.js
