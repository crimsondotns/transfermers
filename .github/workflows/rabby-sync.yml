name: Rabby Transaction Sync

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run transaction sync
        env:
          # Wallet configuration
          WALLET_LIST: ${{ secrets.WALLET_LIST }}

          # Google Sheets configuration
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Sheet1' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          # Rate limit tuning (optional)
          JITTER_MIN_MS: '2000'
          JITTER_MAX_MS: '5000'
          RATE_LIMIT_WAIT_MS: '60000'
          MAX_RETRIES: '10'
          MAX_429_RETRIES: '3'
          MAX_TIMEOUT_RETRIES: '5'
          CHUNK_SIZE: '500'
        run: node src/index.js
