name: Rabby Transaction Sync

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run transaction sync
        env:
          # Wallet configuration
          WALLET_LIST: ${{ secrets.WALLET_LIST }}

          # Google Sheets configuration
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME || 'Sheet1' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          # Logging: INFO (default) or DEBUG for verbose per-request logs
          LOG_LEVEL: 'INFO'

          # --- Global safety guard: must stay well below timeout-minutes above ---
          GLOBAL_TIMEOUT_MS: '1200000'   # stop fetching after 20 min
          WRITE_RESERVE_MS: '90000'      # keep 90s to flush results to Sheets

          # --- Request spacing (adaptive) ---
          JITTER_MIN_MS: '3000'          # min spacing between requests
          JITTER_MAX_MS: '6000'          # max spacing between requests
          MAX_DELAY_MS: '20000'          # ceiling for adaptive request spacing

          # --- Pending-job polling: progressive backoff 20s -> 60s ---
          PENDING_BASE_MS: '20000'
          PENDING_STEP_MS: '10000'
          PENDING_MAX_MS: '60000'
          MAX_PENDING_ROUNDS: '4'

          # --- 429/403 fail-fast ---
          RATE_LIMIT_WAIT_MS: '60000'      # base cooldown when no Retry-After
          MAX_COOLDOWN_MS: '120000'        # hard cap on a single cooldown
          MAX_BLOCK_RETRIES: '2'           # retries per wallet before skipping it
          WALLET_BLOCK_BUDGET_MS: '120000' # max total cooldown per wallet (2 min)
          CIRCUIT_BREAKER_THRESHOLD: '2'   # consecutive blocks => stop and save

          # --- Other budgets ---
          MAX_RETRIES: '10'              # max attempts per wallet
          MAX_TIMEOUT_RETRIES: '5'       # max retries on network timeout
          CHUNK_SIZE: '500'              # rows per Google Sheets write
          MIN_SUCCESS_RATIO: '0.5'       # don't overwrite the sheet from a mostly-failed run
        run: node src/index.js
